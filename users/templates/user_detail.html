{% extends 'MailingListManagement/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ user.image | media_filter_user }}">
                    <div class="card-body">
                        <p class="card-text">Эл.почта": {{ object.email }}</p>
                        <p class="card-text">Телефон: {{ object.phone }}</p>
                        <p class="card-text">Страна: {{ object.country }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'mailing_list_management:mailing_list' %}" role="button">Назад</a>
                            </div>
                            <small class="text-body-secondary">9 mins</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
